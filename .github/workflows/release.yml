name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/release (e.g. v0.2.0). Leave blank to build a dry run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> ~/.cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release artefact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          : "${version:=dev}"
          name="esparagus-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/esparagus.exe "dist/${name}/"
          else
            cp target/${{ matrix.target }}/release/esparagus "dist/${name}/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/${name}/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${name}/"
          else
            tar -czf "${name}.tar.gz" "${name}/"
          fi
          # Per-asset SHA256 — easier to verify than one combined file.
          if command -v shasum >/dev/null; then
            shasum -a 256 "${name}".* > "${name}.sha256"
          else
            sha256sum "${name}".* > "${name}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: esparagus-${{ matrix.target }}
          path: dist/esparagus-*.${{ matrix.archive }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: esparagus-${{ matrix.target }}-sha256
          path: dist/esparagus-*.sha256
          if-no-files-found: error

  release:
    name: publish gh release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artefacts
        run: ls -lh dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
