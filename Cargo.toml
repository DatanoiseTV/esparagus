[package]
name = "esparagus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "ESP32 family flasher with structured observability for CI/CD and LLM feedback loops"
repository = "https://github.com/DatanoiseTV/esparagus"
readme = "README.md"
keywords = ["esp32", "flash", "embedded", "esptool", "ci"]
categories = ["embedded", "command-line-utilities", "development-tools"]

[[bin]]
name = "esparagus"
path = "src/main.rs"

[lib]
name = "esparagus"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serialport = "4.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
byteorder = "1.5"
md-5 = "0.10"
sha2 = "0.10"
miniz_oxide = "0.8"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
base64 = "0.22"
hex = "0.4"
regex = "1.10"
ratatui = "0.29"
crossterm = "0.28"
crc32fast = "1.5"
fs4 = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "ioctl", "term"] }

[dev-dependencies]
proptest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
